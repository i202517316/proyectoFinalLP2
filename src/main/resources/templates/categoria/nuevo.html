<html xmlns:th="http://www.thymeleaf.org" th:replace="layouts/layout :: layoutBase(~{::contenido},~{::contentAside})">

<div th:fragment="contenido">
	<div class="card shadow-lg col-md-6 mx-auto">
		<div class="card-body">
			<h1 class="card-title text-center mb-4">Nueva Categoría</h1>

			<form th:action="@{/categoria/registrar}" method="post" th:object="${categoria}">
				<div class="mb-3">
					<label for="descripcion" class="form-label">Nombre de la Categoría</label>
					<input type="text" class="form-control" th:field="*{descripcion}" id="descripcion"
						placeholder="Ej. Herramientas, Gasfitería, etc." required>
				</div>

				<div class="d-flex justify-content-between mt-4">
					<a th:href="@{/categoria/listado}" class="btn btn-secondary">
						<i class="fa-solid fa-arrow-left"></i> Volver
					</a>
					<button type="submit" class="btn btn-success">
						<i class="fa-solid fa-floppy-disk"></i> Guardar
					</button>
				</div>
			</form>
		</div>
	</div>

	<th:block th:utext="${alert}"></th:block>
</div>

<div th:fragment="contentAside">
</div>

</html>
