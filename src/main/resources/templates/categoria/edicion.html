<html xmlns:th="http://www.thymeleaf.org" th:replace="layouts/layout :: layoutBase(~{::contenido},~{::contentAside})">

<div th:fragment="contenido">
	<div class="card shadow-lg col-md-6 mx-auto">
		<div class="card-body">
			<h1 class="card-title text-center mb-4">Editar Categoría</h1>

			<form th:action="@{/categoria/guardar}" method="post" th:object="${categoria}">
				<div class="mb-3">
					<label for="idCategoria" class="form-label">ID</label>
					<input type="text" class="form-control" th:field="*{idCategoria}" id="idCategoria" readonly>
				</div>

				<div class="mb-3">
					<label for="descripcion" class="form-label">Nombre de la Categoría</label>
					<input type="text" class="form-control" th:field="*{descripcion}" id="descripcion" required>
				</div>

				<div class="d-flex justify-content-between mt-4">
					<a th:href="@{/categoria/listado}" class="btn btn-secondary">
						<i class="fa-solid fa-arrow-left"></i> Volver
					</a>
					<button type="submit" class="btn btn-primary">
						<i class="fa-solid fa-floppy-disk"></i> Actualizar
					</button>
				</div>
			</form>
		</div>
	</div>

	<th:block th:utext="${alert}"></th:block>
</div>

<div th:fragment="contentAside">
</div>

</html>
