<html xmlns:th="http://www.thymeleaf.org" th:replace="layouts/layout :: layoutBase(~{::contenido}, ~{::contentAside})">

<div th:fragment="contenido">

	<div class="card shadow-lg">
		<div class="card-body">
			<h1 class="card-title text-center">Producto Nuevo</h1>
			<div class="row d-flex justify-content-center">
				<div class="col-md-6">
					<form th:action="@{/producto/registrar}" class="row g-2" method="post" novalidate
						th:object="${producto}">
						<div class="col-md-12 position-relative">
							<label for="descripcion" class="form-label"> Descripción </label>
							<input type="text" class="form-control" placeholder="Ingrese una descripción"
								th:field="*{descripcion}" required>
						</div>
						<div class="col-md-6 position-relative">
							<label for="stock" class="form-label">Stock</label>
							<div class="input-group">
								<span class="input-group-text">
									<i class="fa-solid fa-cubes-stacked"></i>
								</span>
								<input class="form-control" type="number" placeholder="0" th:field="*{stock}" required min="0">
							</div>
						</div>
						<div class="col-md-6 position-relative">
							<label for="precio" class="form-label">Precio</label>
							<div class="input-group">
								<span class="input-group-text">S/.</span>
								<input class="form-control" type="number" step="0.01" placeholder="Ej: 49.90"
									th:field="*{precio}" required min="0.1">
							</div>
						</div>
						<div class="col-md-6 position-relative">
							<label for="categoria" class="form-label">Categoría</label>
							<div class="input-group">
								<span class="input-group-text">
									<i class="fa-solid fa-tags"></i>
								</span>
								<select class="form-select" th:field="*{categoria.idCategoria}" required>
									<option value="" selected hidden="hidden">--Seleccione--</option>
									<option th:each="item: ${lstCategorias}" th:value="${item.idCategoria}"
										th:text="${item.descripcion}">
									</option>
								</select>
							</div>
						</div>
						<div class="col-md-6 position-relative">
							<label for="proveedor" class="form-label">Proveedor</label>
							<div class="input-group">
								<span class="input-group-text"><i class="fa-solid fa-truck-fast"></i></span>
								<select class="form-select" th:field="*{proveedor.idProveedor}" required>
									<option value="" selected hidden="hidden">--Seleccione--</option>
									<option th:each="item: ${lstProveedores}" th:value="${item.idProveedor}"
										th:text="${item.razonSocial}">
									</option>
								</select>
							</div>
						</div>
						<div class="col-md-12 d-flex justify-content-between mt-3">
							<!-- Botón Regresar -->
							<a th:href="@{/producto/listado}" class="btn btn-outline-dark">
								<i class="fa-solid fa-reply"></i> Regresar
							</a>
							<!-- Botón Registrar -->
							<button type="submit" class="btn btn-primary">
								<i class="fa-solid fa-floppy-disk"></i> Registrar
							</button>
							<!-- Botón Limpiar -->
							<button type="reset" class="btn btn-secondary">
								<i class="fa-solid fa-broom"></i> Limpiar
							</button>
						</div>
					</form>
				</div>
			</div>
		</div>
	</div>

</div>

<div th:fragment="contentAside"></div>

</html>
