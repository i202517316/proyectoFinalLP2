<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layouts/layout}">

<head>
	<title>Editar Producto - Ferretería</title>
</head>

<body>

	<div layout:fragment="content">
		<div class="row justify-content-center">
			<div class="col-md-8">
				<div class="card shadow-sm border-0 border-top border-info border-4">
					<div class="card-header bg-white pb-0">
						<h4 class="card-title text-dark"><i
								class="fa-solid fa-pen-to-square me-2 text-info"></i>Modificar Producto</h4>
					</div>
					<div class="card-body p-4">

						<div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

						<form th:action="@{/producto/guardar}" method="post" th:object="${producto}">

							<input type="hidden" th:field="*{idProducto}">

							<div class="mb-3">
								<label class="form-label fw-bold">Descripción del Producto</label>
								<input type="text" class="form-control" th:field="*{descripcion}" required
									maxlength="45">
							</div>

							<div class="row mb-3">
								<div class="col-md-6">
									<label class="form-label fw-bold">Categoría</label>
									<select class="form-select" th:field="*{categoria.idCategoria}" required>
										<option th:each="cat : ${categorias}" th:value="${cat.idCategoria}"
											th:text="${cat.descripcion}"></option>
									</select>
								</div>
								<div class="col-md-6">
									<label class="form-label fw-bold">Proveedor</label>
									<select class="form-select" th:field="*{proveedor.idProveedor}" required>
										<option th:each="prov : ${proveedores}" th:value="${prov.idProveedor}"
											th:text="${prov.razonSocial}"></option>
									</select>
								</div>
							</div>

							<div class="row mb-4">
								<div class="col-md-6">
									<label class="form-label fw-bold">Stock Actual</label>
									<input type="number" class="form-control" th:field="*{stock}" required min="0">
								</div>
								<div class="col-md-6">
									<label class="form-label fw-bold">Precio Unitario (S/)</label>
									<input type="number" step="0.01" class="form-control" th:field="*{precio}" required
										min="0.1">
								</div>
							</div>

							<div class="d-flex justify-content-between">
								<a th:href="@{/producto/listado}" class="btn btn-secondary"><i
										class="fa-solid fa-arrow-left"></i> Cancelar</a>
								<button type="submit" class="btn btn-info text-white"><i
										class="fa-solid fa-arrows-rotate"></i> Actualizar Producto</button>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</div>

</body>

</html>
