
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferretería - Inicio de sesión</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>

<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="box-login">
                <div class="card shadow-lg">

                    <div class="card-header text-center bg-info text-white">
                        <h3>FERRETERÍA - Portal Web</h3>
                    </div>

                    <div class="card-body">
                        <h5 class="text-center mb-4">Inicio de Sesión</h5>

                        <div class="alert alert-warning"
                             th:if="${mensaje}"
                             th:text="${mensaje}">
                        </div>

                        <form th:action="@{/iniciar-sesion}"
                              method="get"
                              th:object="${filter}">

                            <div class="mb-3">
                                <label class="form-label" for="cuenta">Cuenta</label>
                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="fa-solid fa-user"></i>
                                    </span>
                                    <input type="text"
                                           id="cuenta"
                                           class="form-control"
                                           placeholder="Ingrese su cuenta"
                                           th:field="*{cuenta}"
                                           required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="clave">Contraseña</label>
                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="fa-solid fa-key"></i>
                                    </span>
                                    <input type="password"
                                           id="clave"
                                           class="form-control"
                                           placeholder="Ingrese su contraseña"
                                           th:field="*{clave}"
                                           required>
                                </div>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-dark">
                                    <i class="fas fa-sign-in-alt"></i> INGRESAR
                                </button>
                            </div>
                        </form>
                    </div>

                    <div class="card-footer text-muted text-center">
                        &copy; 2026 Ferretería - Todos los derechos reservados
                    </div>

                </div>
            </div>
        </div>
    </div>
</body>

</html>
