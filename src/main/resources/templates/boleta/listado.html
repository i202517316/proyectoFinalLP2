<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" th:replace="layouts/layout :: layoutBase(~{::contenido},~{::contentAside})">

<div th:fragment="contenido">
	<div class="card shadow-lg text-dark">
		<div class="card-body">
			<div class="row align-items-center mb-3">
				<div class="col-md-9">
					<h2 class="card-title m-0">Historial de Boletas Emitidas</h2>
				</div>
				<div class="col-md-3 text-end">
					<a th:href="@{/boleta/nuevo}" class="btn btn-success w-100">
						<i class="fa-solid fa-plus"></i> Nueva Venta
					</a>
				</div>
			</div>

			<div class="table-responsive">
				<table id="tbl-boleta" class="table table-hover table-striped table-bordered align-middle">
					<thead class="table-dark text-center">
						<tr>
							<th style="width: 15%;">Número</th>
							<th style="width: 25%;">Fecha de Registro</th>
							<th style="width: 20%;">Cajero / Vendedor</th>
							<th style="width: 20%;">Cliente</th>
							<th style="width: 10%;">Total (S/)</th>
							<th style="width: 10%;">PDF</th>
						</tr>
					</thead>
					<tbody class="table-secondary">
						<tr th:each="item : ${lstBoletas}">
							<td th:text="${item.numBoleta}" class="text-center fw-bold"></td>
							<td th:text="${item.fechaRegistro != null ? #temporals.format(item.fechaRegistro, 'dd/MM/yyyy hh:mm:ss a') : '-'}" class="text-center"></td>
							<td th:text="${item.usuario != null ? item.usuario.fullName : '-'}"></td>
							<td th:text="${item.cliente != null ? item.cliente.fullName : '-'}"></td>
							<td th:text="${item.total != null ? 'S/ ' + #numbers.formatDecimal(item.total, 1, 2) : 'S/ 0.00'}" class="text-end fw-bold text-success"></td>
							<td class="text-center">
								<a th:href="@{/reporte/boleta/{numBoleta}(numBoleta=${item.numBoleta})}" target="_blank"
									class="btn btn-outline-danger btn-sm" title="Descargar Boleta PDF">
									<i class="fa-solid fa-file-pdf fa-lg"></i>
								</a>
							</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</div>

	<script th:inline="none">
		$(document).ready(function () {
			if ($.fn.DataTable.isDataTable('#tbl-boleta')) {
				$('#tbl-boleta').DataTable().destroy();
			}
			$('#tbl-boleta').DataTable({
				language: {
					search: "Buscar: ",
					url: 'https://cdn.datatables.net/plug-ins/2.0.3/i18n/es-ES.json'
				}
			});
		});
	</script>
</div>

<div th:fragment="contentAside">
</div>

</html>
