<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" th:replace="layouts/layout :: layoutBase(~{::contenido},~{::contentAside})">

<div th:fragment="contenido">

	<div class="container mt-2">

		<form th:action="@{/boleta/registrar}" method="post">
			<div class="row mb-3 align-items-center">
				<div class="col-md-9">
					<h1 class="h3 m-0 text-white">Emisión de Boleta de Venta</h1>
					<h5 class="text-info mt-1" th:if="${cliente != null}" th:text="|Cliente: ${cliente.fullName} (DNI: ${cliente.dni})|">
					</h5>
				</div>

				<div class="col-md-3 text-end">
					<a th:href="@{/boleta/listado}" class="btn btn-secondary me-2">
						<i class="fa-solid fa-arrow-left"></i> Volver
					</a>
					<button type="submit" class="btn btn-success">
						<i class="fa-solid fa-floppy-disk"></i> Registrar Venta
					</button>
				</div>
			</div>
		</form>

		<div class="card mb-3 text-dark">
			<div class="card-body py-2">
				<div class="row align-items-center">
					<div class="col-md-4">
						<p class="m-0">
							<strong>Fecha de Emisión:</strong>
							<span th:text="${#temporals.format(#temporals.createNow(), 'dd/MM/yyyy')}"></span>
						</p>
					</div>
					<div class="col-md-8">
						<form th:action="@{/boleta/validar-cliente}" method="get">
							<div class="row justify-content-end align-items-center">
								<label for="dni" class="col-auto col-form-label"><strong>Buscar Cliente por DNI:</strong></label>
								<div class="col-auto">
									<div class="input-group">
										<input type="text" class="form-control" placeholder="Ingrese 8 dígitos" name="dni"
											th:value="${cliente?.dni}" maxlength="8">
										<button th:if="${cliente == null}" class="btn btn-primary"
											type="submit" name="accion" value="buscar" title="Buscar">
											<i class="fa-solid fa-magnifying-glass"></i> Buscar
										</button>
										<button th:if="${cliente != null}" class="btn btn-outline-danger"
											type="submit" name="accion" value="limpiar" title="Cambiar Cliente">
											<i class="fa-solid fa-eraser"></i> Limpiar
										</button>
									</div>
								</div>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>

		<!-- Sección de Selección de Productos -->
		<div class="card mb-3 text-dark">
			<div class="card-body">
				<button class="btn btn-primary mb-3" type="button" data-bs-toggle="modal" data-bs-target="#modalProductos">
					<i class="fa-solid fa-magnifying-glass"></i> Buscar y Seleccionar Producto
				</button>

				<!-- Formulario para agregar producto a la lista temporal -->
				<form id="form-agregar" novalidate th:action="@{/boleta/agregar}" method="post"
					th:object="${productoSeleccionado}" class="needs-validation">
					<div class="row g-2 align-items-end">
						<div class="col-md-2">
							<label for="idProducto" class="form-label">Código</label>
							<input type="text" class="form-control" th:field="*{idProducto}" id="idProducto" readonly required>
						</div>
						<div class="col-md-4">
							<label for="descripcion" class="form-label">Descripción</label>
							<input type="text" class="form-control" th:field="*{descripcion}" id="descripcion" readonly required>
						</div>
						<div class="col-md-2">
							<label for="precio" class="form-label">Precio Unit. (S/)</label>
							<input type="number" step="0.01" class="form-control" th:field="*{precio}" id="precio" required>
						</div>
						<div class="col-md-2">
							<label for="cantidad" class="form-label">Cantidad</label>
							<input type="number" min="1" class="form-control" th:field="*{cantidad}" id="cantidad" required>
						</div>
						<div class="col-md-2 d-grid">
							<button type="submit" class="btn btn-success">
								<i class="fa-solid fa-cart-plus"></i> Agregar
							</button>
						</div>
					</div>
				</form>
			</div>
		</div>

		<!-- Tabla de Detalle de Productos -->
		<div class="card text-dark shadow-sm">
			<div class="card-body">
				<h5 class="card-title mb-3">Detalle de la Venta</h5>
				<div class="table-responsive">
					<table class="table table-bordered table-hover align-middle">
						<thead class="table-dark text-center">
							<tr>
								<th style="width: 10%;">Código</th>
								<th style="width: 40%;">Descripción</th>
								<th style="width: 15%;">Precio</th>
								<th style="width: 10%;">Cantidad</th>
								<th style="width: 15%;">Subtotal</th>
								<th style="width: 10%;">Acción</th>
							</tr>
						</thead>
						<tbody>
							<tr th:if="${seleccionados == null || seleccionados.empty}">
								<td colspan="6" class="text-center text-muted py-3">
									<em>No hay productos agregados en el detalle aún.</em>
								</td>
							</tr>
							<tr th:each="item : ${seleccionados}">
								<td th:text="${item.idProducto}" class="text-center"></td>
								<td th:text="${item.descripcion}"></td>
								<td th:text="${#numbers.formatCurrency(item.precio)}" class="text-end"></td>
								<td th:text="${item.cantidad}" class="text-center"></td>
								<td th:text="${#numbers.formatCurrency(item.subtotal)}" class="text-end fw-bold"></td>
								<td class="text-center">
									<form th:action="@{/boleta/remover}" method="post" style="display:inline;">
										<input type="hidden" name="id" th:value="${item.idProducto}" />
										<button type="submit" class="btn btn-outline-danger btn-sm" title="Quitar">
											<i class="fa-solid fa-trash"></i>
										</button>
									</form>
								</td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
		</div>
	</div>

	<!-- Fragmento Modal de Selección de Productos -->
	<div th:replace="~{fragmento/modal-productos :: modal-productos(${productos}, 'modalProductos')}"></div>

	<th:block th:utext="${alert}"></th:block>

	<!-- Scripts para interacción -->
	<script>
		$(document).ready(function () {
			$(document).on('click', '.btnSeleccionar', function () {
				let idProducto = $(this).data('param1');
				let descripcion = $(this).data('param2');
				let precio = $(this).data('param3');

				$('#idProducto').val(idProducto);
				$('#descripcion').val(descripcion);
				$('#precio').val(precio);
				$('#cantidad').val(1);

				if (typeof $.fn.valid === 'function') {
					$('#idProducto').valid();
					$('#descripcion').valid();
					$('#precio').valid();
					$('#cantidad').valid();
				}

				const modalElement = document.getElementById('modalProductos');
				const modalInstance = bootstrap.Modal.getInstance(modalElement) || new bootstrap.Modal(modalElement);
				modalInstance.hide();
			});

			if (typeof $.fn.validate === 'function') {
				$("#form-agregar").validate({
					rules: {
						descripcion: { required: true },
						precio: { required: true, min: 0.01 },
						cantidad: { required: true, min: 1 }
					},
					messages: {
						descripcion: { required: "Seleccione un producto" },
						precio: { required: "Ingrese precio", min: "Debe ser mayor a 0" },
						cantidad: { required: "Ingrese cantidad", min: "Mínimo 1" }
					},
					errorElement: 'div',
					errorClass: 'text-danger small mt-1',
					highlight: function (element) {
						$(element).addClass('is-invalid').removeClass('is-valid');
					},
					unhighlight: function (element) {
						$(element).removeClass('is-invalid').addClass('is-valid');
					}
				});
			}
		});
	</script>
</div>

<div th:fragment="contentAside">
</div>

</html>
