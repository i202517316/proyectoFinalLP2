<html xmlns:th="http://www.thymeleaf.org" th:replace="layouts/layout :: layoutBase(~{::contenido},~{::contentAside})">

<div th:fragment="contenido">
	<div class="card shadow-lg">
		<div class="card-body">
			<div class="row mb-3">
				<div class="col-md-10">
					<h1 class="card-title">Listado de proveedores</h1>
				</div>
				<div class="col-md-2">
					<a th:href="@{/proveedor/nuevo}" class="btn btn-success w-100"> <i class="fa-solid fa-plus"></i>
						Nuevo
					</a>
				</div>
			</div>

			<div class="table-responsive overflow-auto" style="max-height: 70vh;">
				<table class="table table-hover">
					<thead class="table-dark text-center">
						<tr class="position-sticky top-0">
							<th>Id</th>
							<th>Razón Social</th>
							<th>Celular</th>
							<th>Email</th>
							<th>Acciones</th>
						</tr>
					</thead>
					<tbody class="table-secondary">
						<tr th:each="item:${lstProveedores}">
							<td th:text="${item.idProveedor}" class="text-center"></td>
							<td th:text="${item.razonSocial}"></td>
							<td th:text="${item.celular}" class="text-center"></td>
							<td th:text="${item.email}"></td>
							<td class="d-flex justify-content-evenly align-items-center text-center">
								<a th:href="@{/proveedor/edicion/{id}(id=${item.idProveedor})}"
									class="btn btn-outline-primary" title="Editar" aria-label="Editar" role="button">
									<i class="fa-regular fa-pen-to-square"></i>
								</a>
								<form method="post" th:action="@{/proveedor/eliminar}" th:id="'del-form-' + ${item.idProveedor}">
									<input type="hidden" name="id" th:value="${item.idProveedor}">
									<button type="button" class="btn btn-outline-danger" title="Eliminar"
										th:onclick="'confirmarEliminar(' + ${item.idProveedor} + ')'">
										<i class="fa-regular fa-trash-can"></i>
									</button>
								</form>
							</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</div>
</div>

<div th:fragment="contentAside">
	<script th:inline="javascript">
		function confirmarEliminar(id) {
			Swal.fire({
				title: "¿Deseas eliminar este proveedor?",
				text: "Si tiene productos asignados, no se podrá eliminar.",
				icon: "warning",
				showCancelButton: true,
				confirmButtonColor: "#3085d6",
				cancelButtonColor: "#d33",
				confirmButtonText: "Sí, eliminar",
				cancelButtonText: "Cancelar"
			}).then((result) => {
				if (result.isConfirmed) {
					document.getElementById('del-form-' + id).submit();
				}
			});
		}
	</script>
</div>

</html>
